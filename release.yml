name: Build e publicar ChatApp

# Roda automaticamente sempre que alguém subir mudanças na pasta principal do
# repositório (branch main), ou manualmente pelo botão "Run workflow" no GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necessário pra poder criar a Release sozinho

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Buildar e publicar o instalador
        run: npm run release
        env:
          # Token automático que o próprio GitHub fornece a cada execução —
          # não precisa configurar nada manualmente.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
